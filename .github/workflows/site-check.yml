name: Validate SEKAI site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML structure and JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.images = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      if attrs['id'] in self.ids:
                          raise ValueError('Duplicate id: ' + attrs['id'])
                      self.ids.add(attrs['id'])
                  if tag == 'img':
                      self.images.append(attrs.get('src'))
                  if tag == 'a':
                      self.links.append(attrs.get('href'))
          html = Path('index.html').read_text(encoding='utf-8')
          inspector = Inspector()
          inspector.feed(html)
          required = {'top', 'about', 'units', 'gallery', 'play', 'galleryGrid', 'lightbox', 'menuToggle'}
          assert required <= inspector.ids, required - inspector.ids
          assert len(inspector.images) >= 4
          assert all(not u or u.startswith('https://') for u in inspector.images), 'Unexpected image URL'
          assert all(not u or not u.startswith('#') or u[1:] in inspector.ids for u in inspector.links), 'Broken internal anchor'
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(scripts) == 1, 'Expected exactly one inline script'
          Path('/tmp/sekai-script.js').write_text(scripts[0], encoding='utf-8')
          print('HTML_CHECK=PASS; IDs:',len(inspector.ids),'images:',len(inspector.images))
          PY
          node --check /tmp/sekai-script.js
          echo "JAVASCRIPT_SYNTAX=PASS"
