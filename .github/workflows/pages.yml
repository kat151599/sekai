name: Publish SEKAI website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/index.html
      - name: Try enabling GitHub Pages through GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "PAGES_ALREADY_ENABLED=YES"
          else
            echo "PAGES_ENABLE_ATTEMPT=START"
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
            echo "PAGES_ENABLE_ATTEMPT=SUCCESS"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML from GitHub-hosted terminal
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          echo "PUBLIC_URL=$PUBLIC_URL"
          curl --fail --show-error --silent --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 25 "$PUBLIC_URL" --output /tmp/sekai-live.html
          grep -Fq '<title>SEKAI' /tmp/sekai-live.html
          grep -Fq 'id="galleryGrid"' /tmp/sekai-live.html
          echo "PUBLIC_SITE_HTTP_AND_CONTENT=PASS"
